<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Get moving button</title>
<style>
  :root {
    --bg: #0f0628;
    --btn-idle: #1d1140;
    --btn-hover: #6d28d9;
    --spotlight: #ffd1f2;
    --spotlight-mid: #c084fc;
    --text: #0a0420;
    --glow: rgba(139, 92, 246, 0.55);
  }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    display: grid;
    place-items: center;
    font-family: -apple-system, "Inter", system-ui, sans-serif;
  }

  .cta {
    position: relative;
    isolation: isolate;
    padding: 16px 34px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 14px;
    background: var(--btn-idle);
    color: var(--text);
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.01em;
    cursor: pointer;
    outline: none;
    overflow: hidden;
    box-shadow:
      0 2px 8px rgba(0, 0, 0, 0.25),
      inset 0 1px 0 rgba(255, 255, 255, 0.04);
    transition:
      background 420ms ease,
      color 420ms ease,
      box-shadow 420ms ease,
      transform 420ms ease;
  }

  .cta span {
    position: relative;
    z-index: 1;
    transition: color 420ms ease;
    color: rgba(255, 255, 255, 0.28);
  }

  .cta::before {
    --size: 0;
    content: "";
    position: absolute;
    left: var(--x, 50%);
    top: var(--y, 50%);
    width: var(--size);
    height: var(--size);
    background: radial-gradient(
      circle closest-side,
      var(--spotlight) 0%,
      var(--spotlight-mid) 35%,
      transparent 75%
    );
    transform: translate(-50%, -50%);
    transition: width 360ms ease, height 360ms ease;
    pointer-events: none;
    z-index: 0;
  }

  .cta:hover {
    background: var(--btn-hover);
    box-shadow:
      0 14px 40px -8px var(--glow),
      0 6px 18px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.15);
    transform: translateY(-1px);
  }

  .cta:hover span { color: var(--text); }

  .cta:hover::before { --size: 340px; }

  .cta:active { transform: translateY(0); }
</style>
</head>
<body>
  <button class="cta" type="button">
    <span>Get moving</span>
  </button>

  <script>
    const btn = document.querySelector(".cta");
    btn.addEventListener("pointermove", (e) => {
      const r = btn.getBoundingClientRect();
      btn.style.setProperty("--x", (e.clientX - r.left) + "px");
      btn.style.setProperty("--y", (e.clientY - r.top) + "px");
    });
  </script>
</body>
</html>
